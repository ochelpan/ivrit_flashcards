.pair{display:inline-flex;gap:.55em;align-items:baseline;direction:rtl}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.35;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding:0 16px 20px}

/* header */
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 12px;min-height:58px}
.bar h1{font-size:28px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.bar .mid{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .side{min-width:76px;display:flex}
.bar .side.r{justify-content:flex-end;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:500;padding:8px 2px}
.pill{background:var(--soft);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px}
.pill.primary{background:var(--accent);color:var(--accent-ink)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:600;background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* lists */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sticky{position:sticky;bottom:0;margin-top:auto;padding:16px 0 4px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec .link{text-transform:none;letter-spacing:0;font-size:15px;padding:0}
.grp{font-weight:600;font-size:15px;margin:14px 4px 6px}
.bar+.sec{margin-top:4px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.parts span{background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--muted);font-size:14px;margin-top:2px}

/* flashcard */

.flash{width:100%;max-width:440px;height:min(56vh,440px);position:relative;touch-action:none;perspective:1400px;

  backface-visibility:hidden;-webkit-backface-visibility:hidden}

  padding:11px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}

<body>
<div id="app"></div>
<input id="file" class="hidden-file" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values" multiple>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const HEB = /[֐-׿]/;
const CYR = /[Ѐ-ӿ]/;
const newId = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sizeClass = t => { const n = [...String(t)].length; return n <= 12 ? "w-xl" : n <= 24 ? "w-l" : n <= 60 ? "w-m" : "w-s"; };
const langOf = t => HEB.test(t) ? "he" : CYR.test(t) ? "uk" : "en";

/* Normalise for answer checking: ignore niqqud, case, punctuation, extra spaces */
function norm(s){
  return String(s).normalize("NFKD")
    .replace(/[־\-‐-―_\/]/g, " ")      // maqaf, dashes
    .replace(/[֑-ׇ]/g, "")                  // niqqud & cantillation
    .replace(/[̀-ͯ]/g, "")                  // latin accents
    .toLowerCase()
    .replace(/[.,!?;:"'`´’‘“”״׳()\[\]{}…¿¡]/g, "")
    .replace(/\s+/g, " ").trim();
}
function variants(ans){
  const out = new Set();
  const add = s => { const n = norm(s); if (!n) return; out.add(n); if (n.startsWith("to ")) out.add(n.slice(3)); };
  add(ans);
  add(ans.replace(/\([^)]*\)/g, " "));                // "(to) run" -> "run"
  add(ans.replace(/[()]/g, " "));
  for (const part of ans.split(/[\/;,|]/)) { add(part); add(part.replace(/\([^)]*\)/g, " ")); }
  return out;
}
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function check(input, ans){
  let u = norm(input); if (u.startsWith("to ")) u = u.slice(3);
  if (!u) return "no";
  const vs = variants(ans);
  if (vs.has(u)) return "ok";
  for (const v of vs) if (v.length > 3 && lev(u, v) === 1) return "close";
  return "no";
}

/* ---------- CSV ---------- */
function decode(buf){
  try { return new TextDecoder("utf-8", {fatal: true}).decode(buf); }
  catch { try { return new TextDecoder("windows-1255").decode(buf); } catch { return new TextDecoder().decode(buf); } }
}
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const firstLine = text.split(/\r?\n/).find(l => l.trim()) || "";
  const counts = {",": 0, ";": 0, "\t": 0};
  let q = false;
  for (const ch of firstLine) { if (ch === '"') q = !q; else if (!q && ch in counts) counts[ch]++; }
  let delim = ","; let best = 0;
  for (const k in counts) if (counts[k] > best) { best = counts[k]; delim = k; }
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"' && cell.trim() === "") { inQ = true; cell = ""; }
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
const HEADER_WORDS = new Set(["word","words","translation","translations","term","terms","definition","front","back","hebrew","english","ukrainian","russian","meaning","note","notes","question","answer","print","printed","typed","handwritten","handwriting","script","cursive","letter","letters","name","names","עברית","אנגלית","מילה","תרגום","слово","переклад","англійська","українська","іврит"]);
function langLabel(cells){
  let h = 0, c = 0, l = 0;
  for (const t of cells) { if (HEB.test(t)) h++; else if (CYR.test(t)) c++; else if (/[a-z]/i.test(t)) l++; }
  const m = Math.max(h, c, l);
  if (!m) return "";
  return m === h ? "Hebrew" : m === c ? "Ukrainian" : "English";
}
function buildSet(text, name){
  let rows = parseCSV(text);
  let header = null;
  if (rows.length && rows[0].slice(0, 2).every(c => HEADER_WORDS.has(c.toLowerCase()))) header = rows.shift();
  const cards = rows.filter(r => r.length >= 2 && r[0] && r[1])
    .map(r => { const c = {a: r[0], b: r[1]}; if (r[2]) c.n = r.slice(2).filter(Boolean).join(" · "); return c; });
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  let labelA = header ? cap(header[0]) : langLabel(cards.map(c => c.a));
  let labelB = header ? cap(header[1]) : langLabel(cards.map(c => c.b));
  if (!labelA || !labelB || labelA === labelB) { labelA = labelA || "Word"; labelB = labelB && labelB !== labelA ? labelB : "Translation"; }
  const styleOf = h => /hand|script|cursive/i.test(h) ? "hand" : /^letters?$/i.test(h.trim()) ? "both" : "text";
  const set = {name: name || "New set", cards, labelA, labelB, created: Date.now()};
  if (header) { set.styleA = styleOf(header[0]); set.styleB = styleOf(header[1]); }
  return set;
}

/* ---------- settings ----------
   On GitHub Pages the app finds the repository from the page address
   (owner.github.io/repo/). Fill in owner and repo only if you use a custom domain; branch only if it is not main or master. */
const CONFIG = { owner: "", repo: "", branch: "", folder: "sets" };

/* ---------- storage ----------
   Shared sets: every .csv / .tsv / .txt file in the repository's "sets" folder
   (subfolders become groups). Read-only in the app; edit them on GitHub.
   My sets: added with "+ Add CSV", kept in this browser on this device. */
const LS_LOCAL = "flashcards.sets.v1", LS_REMOTE = "flashcards.remote.v1";
const natural = (x, y) => x.localeCompare(y, undefined, {numeric: true, sensitivity: "base"});
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
function repoInfo(){
  if (CONFIG.owner && CONFIG.repo) return {owner: CONFIG.owner, repo: CONFIG.repo};
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return null;
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return {owner: m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : `${m[1]}.github.io`};
}
/* One request: the repository's file tree (GitHub allows ~60 such requests per hour per network
   without signing in). The CSV files themselves come from raw.githubusercontent.com, which has no such limit. */
async function listViaTree(info){
  const branches = CONFIG.branch ? [CONFIG.branch] : ["main", "master"];
  for (const br of branches) {
    let r;
    try { r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/${encodeURIComponent(br)}?recursive=1`, {cache: "no-store"}); }
    catch { throw new Error("No connection to GitHub."); }
    if (r.status === 404 || r.status === 409 || r.status === 422) continue;
    if (!r.ok) {
      const left = r.headers.get("x-ratelimit-remaining"), reset = +r.headers.get("x-ratelimit-reset");
      if ((r.status === 403 || r.status === 429) && left === "0") {
        const t = reset ? new Date(reset * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
        throw new Error(`GitHub's hourly limit for this internet connection has been reached${t ? `; it resets at ${t}` : ""}.`);
      }
      throw new Error(`GitHub answered with error ${r.status}.`);
    }
    const data = await r.json(), pre = CONFIG.folder + "/";
    return (data.tree || []).filter(it => it.type === "blob" && it.path.startsWith(pre) && /\.(csv|tsv|txt)$/i.test(it.path))
      .map(it => ({path: it.path, url: `https://raw.githubusercontent.com/${info.owner}/${info.repo}/${encodeURIComponent(br)}/${encPath(it.path)}`}));
  }
  throw new Error(`The repository “${info.owner}/${info.repo}” wasn't found. Check that it is public.`);
}
/* Optional list of files, sets/index.json (paths inside "sets"); used when GitHub's file list can't be read. */
async function listViaIndex(){
  const r = await fetch(CONFIG.folder + "/index.json", {cache: "no-store"});
  if (!r.ok) throw new Error("no index");
  return (await r.json()).map(f => ({path: CONFIG.folder + "/" + f, url: encPath(CONFIG.folder + "/" + f)}));
}
async function listRemote(){
  const info = repoInfo();
  if (!info) return await listViaIndex();
  try { return await listViaTree(info); }
  catch (e) { try { return await listViaIndex(); } catch { throw e; } }
}
const Store = {
  mode: "loading", sets: [], local: [], remote: [], note: "", busy: false,
  async init(){
    try { this.local = JSON.parse(localStorage.getItem(LS_LOCAL) || "[]"); } catch { this.local = []; }
    try { this.remote = JSON.parse(localStorage.getItem(LS_REMOTE) || "[]"); } catch { this.remote = []; }
    this.mode = "local"; this.merge(); render();
    await this.refresh();
  },
  merge(){
    this.local.sort((x, y) => (y.created || 0) - (x.created || 0));
    this.remote.sort((x, y) => natural(x.group || "", y.group || "") || natural(x.name, y.name));
    this.sets = [...this.remote, ...this.local];
  },
  async refresh(){
    if (this.busy) return;
    this.busy = true; this.note = ""; if (S.screen === "home") render();
    try {
      const files = await listRemote();
      const loaded = [];
      await Promise.all(files.map(async f => {
        try {
          const r = await fetch(f.url, {cache: "no-store"});
          if (!r.ok) return;
          const parts = f.path.split("/").slice(1);
          const set = buildSet(decode(await r.arrayBuffer()), parts[parts.length - 1].replace(/\.(csv|tsv|txt)$/i, "").trim());
          if (!set.cards.length) return;
          set.id = "gh:" + f.path; set.remote = true; set.group = parts.slice(0, -1).join(" / ");
          loaded.push(set);
        } catch {}
      }));
      if (files.length && !loaded.length) throw new Error("no sets loaded");
      this.remote = loaded;
      try { localStorage.setItem(LS_REMOTE, JSON.stringify(loaded)); } catch {}
    } catch (e) {
      const why = (e && e.message) || "";
      this.note = this.remote.length
        ? `Couldn't check GitHub for changes. ${why} Showing the sets loaded last time.`
        : (repoInfo() ? `Couldn't load the shared sets from GitHub. ${why || "Check your connection."} Then tap Refresh.` : "");
    }
    this.busy = false; this.merge();
    if (S.screen === "set" && !curSet()) S.screen = "home";
    if (S.screen === "home" || S.screen === "set") render();
  },
  saveLocal(){ try { localStorage.setItem(LS_LOCAL, JSON.stringify(this.local)); } catch { throw {code: "quota"}; } },
  get(id){ return this.sets.find(s => s.id === id); },
  async add(set){
    const id = newId();
    this.local.unshift({id, ...set}); this.saveLocal(); this.merge();
    return id;
  },
  async remove(id){ this.local = this.local.filter(s => s.id !== id); this.saveLocal(); this.merge(); },
  async rename(id, name){ const s = this.local.find(x => x.id === id); if (s) s.name = name; this.saveLocal(); this.merge(); }
};
function dbError(e){
  if (e && e.code === "quota") return "This device's browser storage is full. Delete a set and try again.";
  return "Couldn't save on this device.";
}

/* ---------- state ---------- */
const S = { screen: "home", setId: null, dir: "ab", sess: null, modal: null, result: null, sel: null, combo: null, sample: null };
const COMBO = "__combo";
const SAMPLE = "__sample", SAMPLE_N = 20;
const curSet = () => S.setId === COMBO ? S.combo : S.setId === SAMPLE ? S.sample : Store.get(S.setId);
/* a practice set of SAMPLE_N random cards drawn from a set or a combined practice */
function drawSample(src){
  const cards = shuffle(src.cards).slice(0, SAMPLE_N).map(c => ({...c,
    la: c.la || src.labelA, lb: c.lb || src.labelB, sa: c.sa || src.styleA || "text", sb: c.sb || src.styleB || "text"}));
  return {id: SAMPLE, name: `${cards.length} random words`, cards, labelA: src.labelA, labelB: src.labelB,
    styleA: src.styleA, styleB: src.styleB, srcId: src.id, srcName: src.id === COMBO ? src.parts.join(" + ") : src.name};
}
const sampleSource = () => S.sample && (S.sample.srcId === COMBO ? S.combo : Store.get(S.sample.srcId));
function buildCombo(ids){
  const sets = ids.map(id => Store.get(id)).filter(Boolean);
  const seen = new Set(), cards = [];
  for (const st of sets) for (const c of st.cards) {
    const k = norm(c.a) + "|" + norm(c.b);
    if (seen.has(k)) continue;
    seen.add(k); cards.push({...c, la: st.labelA, lb: st.labelB, sa: st.styleA || "text", sb: st.styleB || "text"});
  }
  const uniq = arr => [...new Set(arr)].join(" / ");
  return {id: COMBO, name: "Combined practice", cards, labelA: uniq(sets.map(x => x.labelA)), labelB: uniq(sets.map(x => x.labelB)), parts: sets.map(x => x.name)};
}
const dirOf = c => (c && c.d) || S.dir;        // "ab", "ba"; with "mix" each card carries its own d
const ansIn = (c, d) => d === "ab" ? c.b : c.a;
const P = c => dirOf(c) === "ab" ? c.a : c.b;  // prompt side
const A = c => dirOf(c) === "ab" ? c.b : c.a;  // answer side
const labP = (s, c) => dirOf(c) === "ab" ? (c.la || s.labelA) : (c.lb || s.labelB);
const labA = (s, c) => dirOf(c) === "ab" ? (c.lb || s.labelB) : (c.la || s.labelA);
const stP = (s, c) => (dirOf(c) === "ab" ? (c.sa || s.styleA) : (c.sb || s.styleB)) || "text";
const stA = (s, c) => (dirOf(c) === "ab" ? (c.sb || s.styleB) : (c.sa || s.styleA)) || "text";
/* render card text: plain, handwritten, or printed + handwritten side by side */
const fmt = (t, st) => st === "hand" ? `<span class="hand">${esc(t)}</span>`
  : st === "both" ? `<span class="pair"><span>${esc(t)}</span><span class="hand">${esc(t)}</span></span>` : esc(t);
const cardsOf = s => s.cards.map(c => {
  const x = {...c};
  if (S.dir === "mix") x.d = Math.random() < 0.5 ? "ab" : "ba";
  return x;
});

let toastTimer = null;
function toast(msg){
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ---------- render ---------- */
function render(){
  const app = $("#app");
  const v = ({home: vHome, set: vSet, cards: vCards, match: vMatch, spell: vSpell, test: vTest, result: vResult})[S.screen];
  app.innerHTML = v() + vModal();
  after();
}
function bar(left, mid, right){ return `<div class="bar"><div class="side">${left}</div><div class="mid">${mid}</div><div class="side r">${right}</div></div>`; }
const finishBtn = () => `<button class="pill" data-act="finish">Finish</button>`;

function setItem(s){
  const on = S.sel && S.sel.has(s.id);
  return `<button class="item" data-act="${S.sel ? "toggleSel" : "open"}" data-id="${esc(s.id)}">
    ${S.sel ? `<span class="check${on ? " on" : ""}">${on ? "✓" : ""}</span>` : ""}
    <div class="t"><div class="name" dir="auto">${esc(s.name)}</div><div class="meta">${s.cards.length} cards · ${esc(s.labelA)} – ${esc(s.labelB)}</div></div>
    ${S.sel ? "" : `<span class="chev">›</span>`}</button>`;
}
function vHome(){
  const groups = [];
  for (const s of Store.remote) {
    let g = groups.find(x => x.name === (s.group || ""));
    if (!g) groups.push(g = {name: s.group || "", sets: []});

  if (Store.remote.length || repoInfo()) {

    if (Store.note) shared += `<div class="banner">${esc(Store.note)}</div>`;
    if (!Store.remote.length && Store.busy) shared += `<div class="note">Loading the sets from GitHub…</div>`;
    else if (!Store.remote.length && !Store.note) shared += `<div class="note">No CSV files in the repository's “${esc(CONFIG.folder)}” folder yet.</div>`;
    for (const g of groups) shared += `${g.name ? `<div class="grp" dir="auto">${esc(g.name)}</div>` : ""}<div class="list">${g.sets.map(setItem).join("")}</div>`;
  }
  let mine = "";
  if (Store.local.length) mine = `<div class="sec"><span>My sets · this device only</span></div><div class="list">${Store.local.map(setItem).join("")}</div>`;
  else if (!S.sel) mine = `<div class="sec"><span>My sets · this device only</span></div>
    <div class="empty">Tap <b>+ Add CSV</b> to add your own set. It stays in this browser only. Each line is one card: the word, a comma, then the translation; a third column is optional and shows as a note.
    <pre class="sample">שָׁלוֹם,hello
תּוֹדָה,thank you
לִלְמוֹד,to learn,ללמוד</pre></div>`;
  const body = shared + mine;
  if (S.sel) {
    const ids = Store.sets.filter(x => S.sel.has(x.id)).map(x => x.id);
    const count = ids.length ? buildCombo(ids).cards.length : 0;
    return `<div class="bar"><h1>Combine sets</h1><button class="link" data-act="combineCancel">Cancel</button></div>
      <div class="note" style="padding-top:0">Choose two or more sets to practise together.</div>${body}
      <div class="sticky"><button class="btn primary" data-act="combineGo" ${ids.length < 2 ? "disabled" : ""}>${ids.length < 2 ? "Select at least 2 sets" : `Practise together · ${count} cards`}</button></div>`;
  }
  return `<div class="bar"><h1>Flashcards</h1>${Store.sets.length >= 2 ? `<button class="pill" data-act="combineStart">Combine</button>` : ""}<button class="pill primary" data-act="import">+ Add CSV</button></div>${body}`;
}

function vSet(){
  const s = curSet(); if (!s) { S.screen = "home"; return vHome(); }
  const n = s.cards.length;
  const distinctIn = d => new Set(s.cards.map(c => norm(ansIn(c, d)))).size;
  const distinct = S.dir === "mix" ? Math.min(distinctIn("ab"), distinctIn("ba")) : distinctIn(S.dir);
  const mode = (k, d, ok, why) => `<button class="mode" data-act="start" data-mode="${k}" ${ok ? "" : "disabled"}>
      <span class="ic">${IC[k]}</span><span><div class="mt">${MODE_NAMES[k]}</div><div class="md">${ok ? d : why}</div></span></button>`;
  const isSample = s.id === SAMPLE, isCombo = s.id === COMBO, ro = isCombo || isSample || s.remote;
  return `${bar(isSample ? `<button class="link" data-act="sampleBack">‹ Back</button>` : `<button class="link" data-act="home">‹ Sets</button>`, "", ro ? "" : `<button class="link" data-act="rename">Rename</button>`)}
    <div class="setname" dir="auto">${esc(s.name)}</div>
    <div class="sub">${n} cards${s.remote ? ` · shared${s.group ? ` · ${esc(s.group)}` : ""}` : ""}${isCombo ? ` from ${s.parts.length} sets:<div class="parts">${s.parts.map(x => `<span dir="auto">${esc(x)}</span>`).join("")}</div>` : ""}</div>
    ${isSample ? `<div class="sub" style="margin-top:-14px">Drawn from <span dir="auto">${esc(s.srcName)}</span></div>
      <button class="btn" data-act="sampleNew" style="margin-bottom:18px">${IC.dice} Draw ${SAMPLE_N} new words</button>`
      : n > SAMPLE_N ? `<button class="btn" data-act="sampleGo" style="margin-bottom:18px">${IC.dice} Practise ${SAMPLE_N} random words</button>` : ""}
    <div class="seg">
      <button class="${S.dir === "ab" ? "on" : ""}" data-act="dir" data-dir="ab">${esc(s.labelA)} → ${esc(s.labelB)}</button>
      <button class="${S.dir === "ba" ? "on" : ""}" data-act="dir" data-dir="ba">${esc(s.labelB)} → ${esc(s.labelA)}</button>
      <button class="${S.dir === "mix" ? "on" : ""}" data-act="dir" data-dir="mix">Both ways</button>
    </div>
    <div class="modes">
      ${mode("cards", "Flip and swipe", n >= 1, "")}
      ${mode("match", "Pair words up", n >= 2, "Needs 2+ cards")}
      ${mode("spell", "Type the translation", n >= 1, "")}
      ${mode("test", "Pick from four", distinct >= 4, "Needs 4+ different translations")}
    </div>
    <details class="words"><summary><span>All words</span><span class="chev">›</span></summary>
      <div class="wl">${s.cards.map(c => `<div class="wr"><span dir="auto">${fmt(c.a, c.sa || s.styleA)}</span><span dir="auto">${fmt(c.b, c.sb || s.styleB)}${c.n ? `<br><small>${esc(c.n)}</small>` : ""}</span></div>`).join("")}</div>
    </details>
    ${ro ? "" : `<button class="btn danger" data-act="askDelete">Delete set</button>`}`;
}

/* Cards */
function vCards(){
  const s = S.sess, c = s.order[s.i], set = curSet();
  const pw = P(c), aw = A(c);
  return `${bar(finishBtn(), "Cards", `${s.i + 1} / ${s.order.length}`)}
    <div class="prog"><i style="width:${(s.i / s.order.length) * 100}%"></i></div>
    <div class="stage"><div class="flash${s.flipped ? " flipped" : ""}" id="flash"><div class="inner">
      <div class="face front"><div class="lbl">${esc(labP(set, c))}</div><div class="word ${sizeClass(pw)}" dir="auto" lang="${langOf(pw)}">${fmt(pw, stP(set, c))}</div><div class="hint">Tap to check</div></div>
      <div class="face back"><div class="lbl">${esc(labA(set, c))}</div><div class="word ${sizeClass(aw)}" dir="auto" lang="${langOf(aw)}">${fmt(aw, stA(set, c))}</div>
        ${c.n ? `<div class="cnote" dir="auto">${esc(c.n)}</div>` : ""}<div class="hint">Swipe for the next card</div></div>
    </div></div>
    <div class="arrows">
      <button class="arrow" data-act="cardPrev" aria-label="Previous card" ${s.i === 0 ? "disabled" : ""}>${IC.left}</button>
      <button class="arrow" data-act="cardNext" aria-label="Next card">${IC.right}</button>
    </div></div>`;
}
function bindSwipe(){
  const el = $("#flash"); if (!el) return;
  let sx = 0, sy = 0, dx = 0, down = false;
  el.addEventListener("pointerdown", e => { down = true; sx = e.clientX; sy = e.clientY; dx = 0; el.style.transition = "none"; try { el.setPointerCapture(e.pointerId); } catch {} });
  el.addEventListener("pointermove", e => { if (!down) return; dx = e.clientX - sx; el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; });
  const end = (e, cancel) => {
    if (!down) return; down = false; el.style.transition = "";
    if (!cancel && Math.abs(dx) > 70) { flyOut(el, dx > 0 ? 1 : -1); return; }
    el.style.transform = "";
    if (!cancel && Math.abs(dx) < 8 && Math.abs(e.clientY - sy) < 8) { S.sess.flipped = !S.sess.flipped; el.classList.toggle("flipped", S.sess.flipped); }
  };
  el.addEventListener("pointerup", e => end(e, false));
  el.addEventListener("pointercancel", e => end(e, true));
}
function flyOut(el, dir){
  if (!el || S.sess.busy) return;
  S.sess.busy = true;
  el.style.transform = `translateX(${dir * (window.innerWidth + 200)}px) rotate(${dir * 24}deg)`; el.style.opacity = "0";
  setTimeout(() => {
    const s = S.sess; s.i++; s.flipped = false; s.busy = false;
    if (s.i >= s.order.length) showResult({mode: "cards", big: "✓", title: "All cards done", sub: `You went through all ${s.order.length} cards.`});
    else render();
  }, 230);
}

/* Matching */
const MATCH_N = 5;
function matchRound(){
  const s = S.sess;
  const round = s.pool.slice(s.pos, s.pos + MATCH_N); s.pos += round.length;
  const set = curSet();
  s.left = shuffle(round.map(c => ({t: P(c), st: stP(set, c), k: norm(A(c)), done: false})));
  s.right = shuffle(round.map(c => ({t: A(c), st: stA(set, c), k: norm(A(c)), done: false})));
  s.sel = null; s.bad = null;
}
function vMatch(){
  const s = S.sess;
  const tile = (side, x, i) => {
    const cls = x.done ? " ok" : (s.sel && s.sel.side === side && s.sel.i === i) ? " sel" : (s.bad && s.bad[side] === i) ? " no" : "";
    return `<button class="tile${cls}${[...x.t].length <= 2 ? " big" : ""}" data-act="pick" data-side="${side}" data-i="${i}" dir="auto" lang="${langOf(x.t)}">${fmt(x.t, x.st)}</button>`;
  };
  return `${bar(finishBtn(), "Matching", `${s.matched} / ${s.pool.length}`)}
    <div class="prog"><i style="width:${(s.matched / s.pool.length) * 100}%"></i></div>
    <div class="note" style="text-align:center">Tap a word, then its translation.</div>
    <div class="mgrid"><div class="mcol">${s.left.map((x, i) => tile("L", x, i)).join("")}</div>
    <div class="mcol">${s.right.map((x, i) => tile("R", x, i)).join("")}</div></div>`;
}
function pick(side, i){
  const s = S.sess, list = side === "L" ? s.left : s.right;
  if (list[i].done || s.lock) return;
  s.bad = null;
  if (!s.sel || s.sel.side === side) { s.sel = (s.sel && s.sel.side === side && s.sel.i === i) ? null : {side, i}; render(); return; }
  const L = side === "L" ? i : s.sel.i, R = side === "R" ? i : s.sel.i;
  s.sel = null;
  if (s.left[L].k === s.right[R].k) {
    s.left[L].done = s.right[R].done = true; s.matched++;
    render();
    if (s.left.every(x => x.done)) {
      s.lock = true;
      setTimeout(() => {
        s.lock = false;
        if (s.pos >= s.pool.length) {
          const secs = Math.round((Date.now() - s.t0) / 1000);
          showResult({mode: "match", big: s.mistakes === 0 ? "✓" : String(s.mistakes), title: s.mistakes === 0 ? "No mistakes" : (s.mistakes === 1 ? "mistake" : "mistakes"),
            sub: `${s.pool.length} pairs matched in ${secs < 60 ? secs + " s" : Math.floor(secs / 60) + " min " + (secs % 60) + " s"}.`});
        } else { matchRound(); render(); }
      }, 420);
    }
  } else {
    s.mistakes++; s.bad = {L, R}; render();
    setTimeout(() => { if (S.sess === s && s.bad && s.bad.L === L && s.bad.R === R) { s.bad = null; render(); } }, 500);
  }
}

/* Spelling */
function vSpell(){
  const s = S.sess, q = s.queue[s.i], set = curSet(), pw = P(q.c), aw = A(q.c);
  const answered = s.state !== "ask";
  const fb = s.state === "ok" ? `<div class="fb ok">Correct!${q.c.n ? `<div class="cnote" dir="auto">${esc(q.c.n)}</div>` : ""}</div>`
    : s.state === "close" ? `<div class="fb no"><div class="h">Almost — check the spelling</div><div class="ans" dir="auto" lang="${langOf(aw)}">${fmt(aw, stA(set, q.c))}</div></div>`
    : s.state === "no" ? `<div class="fb no"><div class="h">${s.revealed ? "The answer is" : "Not quite. The answer is"}</div><div class="ans" dir="auto" lang="${langOf(aw)}">${fmt(aw, stA(set, q.c))}</div>${q.c.n ? `<div class="cnote" dir="auto">${esc(q.c.n)}</div>` : ""}</div>` : "";
  const cls = s.state === "ok" ? " ok" : (s.state === "no" || s.state === "close") ? " no" : "";
  return `${bar(finishBtn(), "Spelling", `${Math.min(s.done + 1, s.total)} / ${s.total}`)}
    <div class="prog"><i style="width:${(s.done / s.total) * 100}%"></i></div>
    <div class="prompt"><div class="lbl">${esc(labP(set, q.c))}</div><div class="word ${sizeClass(pw)}" dir="auto" lang="${langOf(pw)}">${fmt(pw, stP(set, q.c))}</div></div>
    <form class="spell" id="spellForm">
      <input id="ans" class="field${cls}" type="text" dir="auto" lang="${langOf(aw)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="Type in ${esc(labA(set, q.c))}" value="${esc(s.input)}" ${answered ? "readonly" : ""}>
      ${fb}
      ${answered ? `<button class="btn primary" type="submit">Next</button>`
        : `<button class="btn primary" type="submit">Check</button><button class="btn" type="button" data-act="reveal">Show answer</button>`}
    </form>
    ${q.retry && !answered ? `<div class="note" style="text-align:center">You missed this one earlier.</div>` : ""}`;
}
function spellSubmit(){
  const s = S.sess, q = s.queue[s.i];
  if (s.state === "ask") {
    const v = $("#ans").value; s.input = v;
    if (!v.trim()) { $("#ans").focus(); return; }
    s.state = check(v, A(q.c));
    if (s.state !== "ok" && !q.retry) s.queue.push({c: q.c, retry: true});
    if (!q.retry) { if (s.state === "ok") s.first++; s.done++; }
    render();
  } else spellNext();
}
function spellNext(){
  const s = S.sess; s.i++; s.state = "ask"; s.input = ""; s.revealed = false;
  if (s.i >= s.queue.length) {
    showResult({mode: "spell", big: `${s.first}/${s.total}`, title: "right on the first try", sub: s.first === s.total ? "Perfect spelling." : "Missed words came back once more at the end."});
  } else { render(); const a = $("#ans"); if (a) a.focus(); }
}

/* Test */
function testQuestion(){
  const s = S.sess, c = s.order[s.i], right = A(c), rk = norm(right);
  const seen = new Set([rk]), wrong = [], heb = HEB.test(right);
  const pool = shuffle(s.all).map(x => ansIn(x, dirOf(c)));
  for (const pass of [true, false]) for (const t of pool) {   // prefer options in the same script as the answer
    if (wrong.length === 3) break;
    const k = norm(t);
    if (seen.has(k) || (pass && HEB.test(t) !== heb)) continue;
    seen.add(k); wrong.push(t);
  }
  s.opts = shuffle([right, ...wrong]); s.correct = s.opts.indexOf(right); s.chosen = null;
}
function vTest(){
  const s = S.sess, c = s.order[s.i], set = curSet(), pw = P(c);
  const opt = (t, i) => {
    let cls = "";
    if (s.chosen !== null) cls = i === s.correct ? " ok" : i === s.chosen ? " no" : " dim";
    return `<button class="opt${cls}${[...t].length <= 2 ? " big" : ""}" data-act="choose" data-i="${i}" dir="auto" lang="${langOf(t)}">${fmt(t, stA(set, c))}</button>`;
  };
  const after = s.chosen !== null && s.chosen !== s.correct;
  return `${bar(finishBtn(), "Test", `${s.i + 1} / ${s.order.length}`)}
    <div class="prog"><i style="width:${(s.i / s.order.length) * 100}%"></i></div>
    <div class="prompt"><div class="lbl">${esc(labP(set, c))}</div><div class="word ${sizeClass(pw)}" dir="auto" lang="${langOf(pw)}">${fmt(pw, stP(set, c))}</div>
      ${s.chosen !== null && c.n ? `<div class="cnote" dir="auto">${esc(c.n)}</div>` : ""}</div>
    <div class="opts">${s.opts.map(opt).join("")}</div>
    ${after ? `<div class="foot" style="margin-top:0"><button class="btn primary" data-act="testNext">Next</button></div>` : ""}`;
}
function choose(i){
  const s = S.sess; if (s.chosen !== null) return;
  s.chosen = i; if (i === s.correct) s.score++;
  render();
  if (i === s.correct) { const me = s; setTimeout(() => { if (S.sess === me && S.screen === "test") testNext(); }, 650); }
}
function testNext(){
  const s = S.sess; s.i++;
  if (s.i >= s.order.length) {
    const pct = Math.round(100 * s.score / s.order.length);
    showResult({mode: "test", big: pct + "%", title: `${s.score} of ${s.order.length} correct`, sub: pct === 100 ? "Perfect score." : ""});
  } else { testQuestion(); render(); }
}

/* Result */
function showResult(r){ S.result = r; S.screen = "result"; S.sess = null; render(); }
function vResult(){
  const r = S.result;
  return `${bar("", MODE_NAMES[r.mode], "")}
    <div class="result"><div class="big">${esc(r.big)}</div><div class="rt">${esc(r.title)}</div><div class="rs">${esc(r.sub)}</div></div>
    <div class="foot"><button class="btn primary" data-act="start" data-mode="${r.mode}">Again</button><button class="btn" data-act="finish">Back to set</button></div>`;
}

/* Modal */
function vModal(){
  const m = S.modal; if (!m) return "";
  if (m.type === "delete") return `<div class="scrim" data-act="closeModal"><div class="sheet" data-stop="1">
      <h3>Delete “${esc(curSet()?.name)}”?</h3><p>The set and its cards will be removed. You can add the CSV again later.</p>
      <div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" style="background:var(--bad);color:#fff" data-act="doDelete">Delete</button></div></div></div>`;
  if (m.type === "rename") return `<div class="scrim" data-act="closeModal"><div class="sheet" data-stop="1">
      <h3>Rename set</h3><form id="renameForm"><input id="newName" class="field" style="font-size:18px;text-align:start" dir="auto" value="${esc(curSet()?.name)}" maxlength="80"></form>
      <div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="doRename">Save</button></div></div></div>`;
  return "";
}

/* ---------- after render ---------- */
function after(){
  if (S.screen === "cards") bindSwipe();
  const sf = $("#spellForm"); if (sf) sf.onsubmit = e => { e.preventDefault(); spellSubmit(); };
  const rf = $("#renameForm"); if (rf) { rf.onsubmit = e => { e.preventDefault(); doRename(); }; }
}

/* ---------- actions ---------- */
function start(mode){
  const set = curSet(); if (!set) return;
  const cards = cardsOf(set);
  if (mode === "cards") S.sess = {order: shuffle(cards), i: 0, flipped: false};
  if (mode === "match") { S.sess = {pool: shuffle(cards), pos: 0, matched: 0, mistakes: 0, t0: Date.now()}; S.screen = "match"; matchRound(); }
  if (mode === "spell") S.sess = {queue: shuffle(cards).map(c => ({c, retry: false})), i: 0, state: "ask", input: "", first: 0, done: 0, total: cards.length};
  if (mode === "test") { S.sess = {order: shuffle(cards), all: cards, i: 0, score: 0}; S.screen = "test"; testQuestion(); }
  S.screen = mode; render();
  if (mode === "spell") { const a = $("#ans"); if (a) a.focus(); }
  window.scrollTo(0, 0);
}
async function doDelete(){
  const id = S.setId; S.modal = null;
  try { await Store.remove(id); S.screen = "home"; S.setId = null; toast("Set deleted"); } catch (e) { toast(dbError(e)); }
  render();
}
async function doRename(){
  const v = ($("#newName")?.value || "").trim(); if (!v) return;
  S.modal = null; render();
  try { await Store.rename(S.setId, v); } catch (e) { toast(dbError(e)); }
  render();
}
async function importFiles(files){
  for (const f of files) {
    try {
      const text = decode(await f.arrayBuffer());
      const set = buildSet(text, f.name.replace(/\.(csv|tsv|txt)$/i, "").trim());
      if (!set.cards.length) { toast(`No cards found in ${f.name}`); continue; }
      if (new Blob([JSON.stringify(set)]).size > 240000) { toast(`${f.name} is too large. Split it into smaller files.`); continue; }
      await Store.add(set);
      toast(`Added “${set.name}” · ${set.cards.length} cards`);
    } catch (e) { toast(dbError(e)); }
  }
  render();
}

const ACT = {
  import: () => { const f = $("#file"); f.value = ""; f.click(); },
  refresh: () => Store.refresh(),
  sampleGo: () => { const src = curSet(); if (!src) return; S.sample = drawSample(src); S.setId = SAMPLE; render(); window.scrollTo(0, 0); },
  sampleNew: () => { const src = sampleSource(); if (!src) { S.screen = "home"; render(); return; } S.sample = drawSample(src); render(); toast(`${S.sample.cards.length} new words drawn`); },
  sampleBack: () => { S.setId = S.sample ? S.sample.srcId : null; S.screen = curSet() ? "set" : "home"; render(); window.scrollTo(0, 0); },
  combineStart: () => { S.sel = new Set(); render(); window.scrollTo(0, 0); },
  combineCancel: () => { S.sel = null; render(); },
  toggleSel: el => { const id = el.dataset.id; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); },
  combineGo: () => {
    const ids = Store.sets.filter(x => S.sel.has(x.id)).map(x => x.id);
    if (ids.length < 2) return;
    S.combo = buildCombo(ids); S.setId = COMBO; S.sel = null; S.screen = "set"; render(); window.scrollTo(0, 0);
  },
  open: el => { S.setId = el.dataset.id; S.screen = "set"; render(); window.scrollTo(0, 0); },
  home: () => { S.screen = "home"; render(); },
  dir: el => { S.dir = el.dataset.dir; render(); },
  start: el => start(el.dataset.mode),
  finish: () => { S.sess = null; S.screen = curSet() ? "set" : "home"; render(); window.scrollTo(0, 0); },
  cardNext: () => flyOut($("#flash"), -1),
  cardPrev: () => { const s = S.sess; if (s.busy || s.i === 0) return; s.i--; s.flipped = false; render(); },
  pick: el => pick(el.dataset.side, +el.dataset.i),
  reveal: () => {
    const s = S.sess, q = s.queue[s.i];
    s.state = "no"; s.revealed = true; s.input = $("#ans").value;
    if (!q.retry) { s.queue.push({c: q.c, retry: true}); s.done++; }
    render();
  },
  choose: el => choose(+el.dataset.i),
  testNext: () => testNext(),
  askDelete: () => { S.modal = {type: "delete"}; render(); },
  rename: () => { S.modal = {type: "rename"}; render(); const i = $("#newName"); if (i) { i.focus(); i.select(); } },
  closeModal: (el, e) => { if (e.target.closest("[data-stop]") && el.classList.contains("scrim")) return; S.modal = null; render(); },
  doDelete: () => doDelete(),
  doRename: () => doRename()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
$("#file").addEventListener("change", e => { const fs = [...e.target.files]; if (fs.length) importFiles(fs); });

render();
Store.init();
</script>
</body>
